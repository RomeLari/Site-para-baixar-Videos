<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Download Videos</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header class="header">
            <div class="logo-horizontal">
                <div class="logo">
                    <i class="fa-brands fa-youtube"></i>
                </div>
            </div>
            <h1>Site para Baixar Vídeos</h1>
        </header>

        <div class="container">
            <textarea class="space-text" placeholder="Copie e cole o link do vídeo que você deseja baixar" required autofocus></textarea>
            <button type="submit" class="submit">
                <i class="fa-solid fa-download"></i>
                Submit
            </button>

        </div>
        <div class="contato">
                <li>GitHub: Larissa Romero</li>
                <li>Instagram: Larissa Romero</li>
                <li>TikTok: Larissa Romero</li>
        </div>
    </body>
</html>
